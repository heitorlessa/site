name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/blog-scaffold-5t72o8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (GitHub Actions source) on first run.
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for build-time Mermaid)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # base_path from configure-pages is e.g. "/site"; fall back to it so
          # the site works no matter the repo name.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
